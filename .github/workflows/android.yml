name: Dünya Bayrakları APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Kodları indir
        uses: actions/checkout@v4

      - name: Python ve Java kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Sistem paketlerini kur
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev automake

      - name: Buildozer kur
        run: |
          pip install --upgrade pip
          pip install buildozer setuptools cython==0.29.34

      - name: APK oluştur
        run: buildozer -v android debug

      - name: APK dosyasını kaydet
        uses: actions/upload-artifact@v4
        with:
          name: dunya-bayraklari-apk
          path: bin/*.apk
